<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dark theme toggle</title>
<style>
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --text: #1d2330;
    --muted: #5d6677;
    --track: #cfd6e4;
    --knob: #ffffff;
    --accent: #2f5de4;
    --border: #dcd9d0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c;
      --surface: #1b1f29;
      --text: #e8eaf0;
      --muted: #98a1b3;
      --track: #2c3550;
      --knob: #0f1218;
      --accent: #8aa5ff;
      --border: #2a2f3c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c;
    --surface: #1b1f29;
    --text: #e8eaf0;
    --muted: #98a1b3;
    --track: #2c3550;
    --knob: #0f1218;
    --accent: #8aa5ff;
    --border: #2a2f3c;
    color-scheme: dark;
  }

  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: grid;
    place-items: center;
    gap: 2rem;
    padding: 2rem 1.25rem;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    transition: background .35s ease, color .35s ease;
  }
  main { width: 100%; max-width: 26rem; display: grid; gap: 1.5rem; justify-items: center; }

  /* The toggle */
  .toggle {
    position: relative;
    width: 5rem;
    height: 2.5rem;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: var(--track);
    cursor: pointer;
    transition: background .35s ease;
  }
  .toggle:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .toggle .knob {
    position: absolute;
    top: .25rem;
    left: .25rem;
    width: 2rem;
    height: 2rem;
    border-radius: 50%;
    background: var(--knob);
    display: grid;
    place-items: center;
    transition: transform .35s cubic-bezier(.5, 1.4, .5, 1), background .35s ease;
  }
  .toggle[aria-checked="true"] .knob { transform: translateX(2.5rem); }
  .toggle svg {
    grid-area: 1 / 1;
    width: 1.2rem;
    height: 1.2rem;
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: opacity .25s ease, transform .35s ease;
  }
  .toggle .moon { opacity: 0; transform: rotate(-60deg) scale(.6); }
  .toggle[aria-checked="true"] .sun  { opacity: 0; transform: rotate(60deg) scale(.6); }
  .toggle[aria-checked="true"] .moon { opacity: 1; transform: none; }

  /* Sample content so the change is visible */
  .card {
    width: 100%;
    padding: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    transition: background .35s ease, border-color .35s ease;
  }
  .card h1 { margin: 0 0 .5rem; font-size: 1.35rem; }
  .card p { margin: 0; color: var(--muted); line-height: 1.55; }
  .status { font-size: .95rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <button class="toggle" id="themeToggle" type="button" role="switch" aria-checked="false" aria-label="Dark theme">
    <span class="knob">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </span>
  </button>
  <div class="status" id="status" aria-live="polite">Light theme</div>

  <section class="card">
    <h1>Pick the theme that suits your eyes</h1>
    <p>Your choice is saved in this browser. On your first visit, the page follows your device's light or dark setting.</p>
  </section>
</main>

<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById('themeToggle');
  var status = document.getElementById('status');
  var KEY = 'theme';

  function systemPrefersDark() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function readSaved() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }

  function save(value) {
    try { localStorage.setItem(KEY, value); } catch (e) { /* storage unavailable */ }
  }

  function apply(theme) {
    root.setAttribute('data-theme', theme);
    var dark = theme === 'dark';
    btn.setAttribute('aria-checked', String(dark));
    status.textContent = dark ? 'Dark theme' : 'Light theme';
  }

  var saved = readSaved();
  apply(saved === 'dark' || saved === 'light' ? saved : (systemPrefersDark() ? 'dark' : 'light'));

  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(next);
    save(next);
  });
})();
</script>
</body>
</html>
